name: Biothrix Release (Android APK & iOS Package)

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release Version (e.g. v1.0.2)'
        required: false
        default: 'v1.0.2'
  push:
    branches: [ main, master ]
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android Release (APK & AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Build Release App Bundle (AAB)
        run: flutter build appbundle --release --android-skip-build-dependency-validation

      - name: Rename Artifacts
        run: |
          mkdir -p release-artifacts
          cp build/app/outputs/flutter-apk/app-release.apk release-artifacts/Biothrix-release.apk
          cp build/app/outputs/bundle/release/app-release.aab release-artifacts/Biothrix-release.aab

      - name: Upload Android Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-artifacts
          path: release-artifacts/*

  build-ios:
    name: Build iOS Release (IPA & App)
    runs-on: macos-latest
    continue-on-error: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS Application (Simulator / Unsigned)
        run: flutter build ios --simulator

      - name: Package iOS IPA (Payload Archive)
        run: |
          mkdir -p ios-artifacts/Payload
          cp -r build/ios/iphonesimulator/Runner.app ios-artifacts/Payload/
          cd ios-artifacts
          zip -r Biothrix.ipa Payload
          zip -r Runner.app.zip Payload/Runner.app
          rm -rf Payload

      - name: Upload iOS Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-artifacts
          path: ios-artifacts/*



  publish-release:
    name: Publish Official GitHub Release
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    if: always() && needs.build-android.result == 'success'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Determine Release Tag
        id: versioning
        run: |
          RAW_VERSION=$(grep '^version:' pubspec.yaml | head -n 1 | awk '{print $2}' | cut -d '+' -f 1)
          if [ -z "$RAW_VERSION" ]; then
            RAW_VERSION="1.0.4"
          fi
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            RELEASE_TAG="${{ github.ref_name }}"
          elif [ -n "${{ github.event.inputs.release_version }}" ]; then
            RELEASE_TAG="${{ github.event.inputs.release_version }}"
          else
            RELEASE_TAG="v${RAW_VERSION}"
          fi
          echo "tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          echo "version=$RAW_VERSION" >> $GITHUB_OUTPUT
          echo "Resolved Release Tag: $RELEASE_TAG"

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release-artifacts
          path: release-files

      - name: Download iOS Artifacts (if available)
        if: needs.build-ios.result == 'success'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ios-release-artifacts
          path: release-files

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.tag }}
          name: Biothrix Release ${{ steps.versioning.outputs.tag }}
          make_latest: true
          prerelease: false
          fail_on_unmatched_files: false
          body: |
            ## Biothrix Wellness — Release ${{ steps.versioning.outputs.tag }}

            ### Included Release Packages:
            - **Android APK** (`Biothrix-release.apk`): Direct install on any Android phone.
            - **Android App Bundle** (`Biothrix-release.aab`): For Google Play Store submission.
            - **iOS Package** (`Biothrix.ipa`): For iOS sideloading (AltStore, Sideloadly, TrollStore) or re-signing (when built).
            - **iOS Runner Bundle** (`Runner.app.zip`): Xcode simulator / archive (when built).

            ### Highlights:
            - Platform-adaptive glass design (Frosted Android, Liquid-Glass iOS).
            - 16px responsive grid layout matching guidelines.
            - All user inputs now slide up smoothly from the bottom with haptic feedback.
            - Custom wellness calendar bottom sheet with 4-color telemetry dots.
            - Dedicated BPM and Weight analytics hub pages.
            - Investor Presentation Demo Mode toggle in Settings (retains user's personal name).
            - Zero demo data by default: all users start fresh.
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
